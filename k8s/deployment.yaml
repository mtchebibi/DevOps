apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld-deployment
  namespace: tp-k8s
  labels:
    app: helloworld
spec:
  replicas: 3
  selector:
    matchLabels:
      app: helloworld
  template:
    metadata:
      labels:
        app: helloworld
    spec:
      containers:
      - name: helloworld-container
        image: mtchebibi/devops-hello:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80