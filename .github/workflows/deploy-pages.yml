---
name: TP DevOps - Docker Hub et GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Lint HTML
        run: npx --yes htmlhint@1.1.4 site/index.html

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint YAML
        run: |
          pip install yamllint
          yamllint ansible/playbook.yml .github/workflows/*.yml k8s/*.yaml

      - name: Syntax-check Ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml
          ansible-playbook --syntax-check -i ansible/inventory.ini ansible/playbook.yml

  build-and-push:
    name: Build et push de l'image
    needs: lint
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/devops-hello
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les secrets Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Ajoutez les secrets DOCKERHUB_USERNAME et DOCKERHUB_TOKEN."
            exit 1
          fi

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  extract-and-deploy:
    name: Déploiement GitHub Pages
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Uploader l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
