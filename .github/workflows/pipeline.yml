
    
  
name: TP DevOps

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  hello:
    name: Hello World
    runs-on: ubuntu-latest
    steps:
      - name: Afficher Hello World
        run: echo "Hello World"

  nom:
    name: Afficher le nom
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le nom
        run: |
          echo "Nom : ${{ vars.NOM }}"

  prenom:
    name: Afficher le prénom
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le prénom
        run: |
          echo "Prénom : ${{ vars.PRENOM }}"

  email:
    name: Afficher l'email
    runs-on: ubuntu-latest
    steps:
      - name: Afficher l'email
        run: |
          echo "Email : ${{ vars.EMAIL }}"

  python:
    name: Script Python
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Exécuter le script
        run: python scripts/commit_success.py

  branche:
    name: Afficher la branche
    runs-on: ubuntu-latest
    steps:
      - name: Branche courante
        run: |
          echo "Branche : $GITHUB_REF_NAME"

  calcul:
    name: Calcul selon la branche
    if: ${{ github.ref_name == 'Dev' || github.ref_name == 'Val' || github.ref_name == 'Prod' }}
    runs-on: ubuntu-latest
    env:
      NUMBER: ${{ vars.NUMBER }}
    steps:
      - name: Vérifier NUMBER
        shell: bash
        run: |
          if ! [[ "$NUMBER" =~ ^[0-9]+$ ]]; then
            echo "NUMBER doit être un entier positif."
            exit 1
          fi

      - name: Dev - division par 2
        id: dev
        shell: bash
        run: |
          result=$(( NUMBER / 2 ))
          echo "Résultat Dev : $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

          if (( result % 2 != 0 )); then
            echo "Le résultat est impair : arrêt."
            exit 1
          fi

      - name: Val - division par 4
        if: ${{ github.ref_name == 'Val' || github.ref_name == 'Prod' }}
        id: val
        shell: bash
        env:
          DEV_RESULT: ${{ steps.dev.outputs.result }}
        run: |
          result=$(( DEV_RESULT / 4 ))
          echo "Résultat Val : $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

          if (( result % 2 != 0 )); then
            echo "Le résultat est impair : arrêt."
            exit 1
          fi

      - name: Prod - division par 8
        if: ${{ github.ref_name == 'Prod' }}
        shell: bash
        env:
          VAL_RESULT: ${{ steps.val.outputs.result }}
        run: |
          result=$(( VAL_RESULT / 8 ))
          echo "Résultat Prod : $result"

